# =============================================================================
# 🧰 TypeScript Project Setup
# Installs dependencies, builds TypeScript, and optionally runs lint and tests.
# Inputs:
#   - run_lint: Run ESLint if true
#   - run_tests: Run test script if true
# =============================================================================

name: Typescript CI

on:
  workflow_call:
    inputs:
      runner:
        description: 'Choose the runner'
        required: false
        default: 'ubuntu-latest'
        type: string

jobs:
  eslint:
    name: Run EsLint
    runs-on: ${{ inputs.runner }}

    steps:
      - name: 🔐 Get GitHub App Token
        id: get_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PPC_CI_APP_ID }}
          private-key: ${{ secrets.PPC_CI_APP_PRIVATE_KEY }}

      - name: 🛫 Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.get_token.outputs.token }}

      - name: 🟢 Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: 🔧 Setup Node and NPM
        uses: stetind/ppc-github-composite-actions/.github/actions/install-global-dependencies@v2.0.5
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 🚀 Run Eslint
        run: npm run lint-quiet

  testing:
    name: Run Jest Tests
    runs-on: ${{ inputs.runner }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: 🔐 Get GitHub App Token
        id: get_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PPC_CI_APP_ID }}
          private-key: ${{ secrets.PPC_CI_APP_PRIVATE_KEY }}

      - name: 🛫 Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.get_token.outputs.token }}

      - name: 🟢 Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: 🔧 Setup Node and NPM
        uses: stetind/ppc-github-composite-actions/.github/actions/install-global-dependencies@v2.0.5
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 🔧 Building Environment
        run: npm run build --if-present

      - name: 🔧 Run Tests
        id: run_test
        run: npm run test:ci
